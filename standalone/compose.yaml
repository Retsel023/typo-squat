# Run from this folder: docker compose up --build -d
# Shared tooling includes Amass, Subfinder, Assetfinder, MassDNS, Gowitness, Chromium and Python.
services:
  monitor:
    build:
      context: ../monitor
      dockerfile: Dockerfile
    image: typo-monitor:standalone
    entrypoint:
      - python
      - -m
      - typo_monitor
      - --data-dir
      - /data
      - --chrome-path
      - /usr/bin/chromium
    command: ["serve", "--host", "0.0.0.0", "--port", "5000"]
    environment:
      TYPO_MONITOR_API_TOKEN: ""
      TYPO_DNS_WORKERS: "${TYPO_DNS_WORKERS:-24}"
      TYPO_DNS_BACKEND: "${TYPO_DNS_BACKEND:-massdns}"
      TYPO_DNS_RESOLVERS: "${TYPO_DNS_RESOLVERS:-}"
      TYPO_DNS_RESOLVER_MODE: "${TYPO_DNS_RESOLVER_MODE:-ordered}"
      TYPO_MAX_CANDIDATES: "${TYPO_MAX_CANDIDATES:-250000}"
      # Combined launches three independent sources; failures remain visible.
      TYPO_DISCOVERY_ENGINE: "${TYPO_DISCOVERY_ENGINE:-combined}"
      TYPO_DISCOVERY_TIMEOUT: "${TYPO_DISCOVERY_TIMEOUT:-600}"
      TYPO_AMASS_CONFIG: "${TYPO_AMASS_CONFIG:-}"
    init: true
    shm_size: 256mb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TYPO_STANDALONE_PORT:-5055}:5000"
    volumes:
      - standalone-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  standalone-data:
