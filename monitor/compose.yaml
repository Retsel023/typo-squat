services:
  monitor:
    build: .
    image: typo-monitor:local
    environment:
      TYPO_DNS_WORKERS: "${TYPO_DNS_WORKERS:-24}"
    init: true
    shm_size: 256mb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - monitor-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  monitor-data:
