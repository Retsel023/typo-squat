services:
  monitor:
    build: .
    image: typo-monitor:local
    environment:
      TYPO_DNS_WORKERS: "${TYPO_DNS_WORKERS:-24}"
      TYPO_DNS_BACKEND: "${TYPO_DNS_BACKEND:-massdns}"
      TYPO_DNS_RESOLVERS: "${TYPO_DNS_RESOLVERS:-}"
      TYPO_DNS_RESOLVER_MODE: "${TYPO_DNS_RESOLVER_MODE:-ordered}"
      TYPO_MAX_CANDIDATES: "${TYPO_MAX_CANDIDATES:-250000}"
      # Combined launches three independent sources; failures remain visible.
      TYPO_DISCOVERY_ENGINE: "${TYPO_DISCOVERY_ENGINE:-combined}"
      TYPO_DISCOVERY_TIMEOUT: "${TYPO_DISCOVERY_TIMEOUT:-600}"
      TYPO_AMASS_CONFIG: "${TYPO_AMASS_CONFIG:-}"
      TYPO_TOR_PROXY_URL: "${TYPO_TOR_PROXY_URL:-socks5h://tor:9050}"
      TYPO_WEB_TIMEOUT: "${TYPO_WEB_TIMEOUT:-3}"
      TYPO_WEB_WORKERS: "${TYPO_WEB_WORKERS:-24}"
      TYPO_CAPTURE_WORKERS: "${TYPO_CAPTURE_WORKERS:-4}"
      TYPO_CAPTURE_PAGE_TIMEOUT: "${TYPO_CAPTURE_PAGE_TIMEOUT:-60}"
      TYPO_CAPTURE_DELAY: "${TYPO_CAPTURE_DELAY:-3}"
      TYPO_CAPTURE_TIMEOUT: "${TYPO_CAPTURE_TIMEOUT:-900}"
    networks:
      - default
      - tor-route
    init: true
    shm_size: "${TYPO_BROWSER_SHM_SIZE:-256mb}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - monitor-data:/data
    read_only: true
    tmpfs:
      # Rod extracts its Leakless browser helper here and must execute it.
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  tor:
    profiles: ["tor"]
    build: ./tor
    image: typo-monitor:tor
    init: true
    restart: "no"
    networks:
      - tor-route
    volumes:
      - tor-data:/var/lib/tor
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  monitor-data:
  tor-data:

networks:
  default:
  tor-route:
